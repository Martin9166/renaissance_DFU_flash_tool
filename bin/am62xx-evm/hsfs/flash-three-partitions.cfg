# Run from tools/DFU_flash with --repartition-emmc.
# WARNING: recreates the eMMC UDA layout and overwrites existing data.

--file="bin/am62xx-evm/hsfs/images/tiboot3.bin" --operation=flash-emmc --flash-offset=0x0 --attributes="raw,1,-"
--file="bin/am62xx-evm/hsfs/images/tispl.bin" --operation=flash-emmc --flash-offset=0x80000 --attributes="raw,1,-"
--file="bin/am62xx-evm/hsfs/images/u-boot.img" --operation=flash-emmc --flash-offset=0x280000 --attributes="raw,1,-"

# A/B system slots, 2 GiB each. These may contain the same initial system image.
--file="bin/am62xx-evm/hsfs/images/rootfs.ext4" --operation=flash-emmc --flash-offset=0x0 --attributes="part,0,1"
--file="bin/am62xx-evm/hsfs/images/rootfs.ext4" --operation=flash-emmc --flash-offset=0x0 --attributes="part,0,2"
# Shared persistent data, remaining space.
--file="bin/am62xx-evm/hsfs/images/data.ext4" --operation=flash-emmc --flash-offset=0x0 --attributes="part,0,3"
